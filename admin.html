
<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minhaji Bayan Admin</title>
<style>
body{
  font-family:Arial,sans-serif;
  background:#f2f5ef;
  padding:15px;
  color:#183b2b;
}
.container{
  max-width:500px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 3px 12px #ccc;
}
h2{text-align:center;color:#17633d}
input,textarea{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin:8px 0 15px;
  border:1px solid #bbb;
  border-radius:8px;
  font-size:16px;
}
button{
  width:100%;
  padding:13px;
  background:#16733f;
  color:white;
  border:0;
  border-radius:8px;
  font-size:17px;
  margin:6px 0;
}
.secondary{background:#245b91}
label{font-weight:bold}
</style>
</head>
<body>

<div class="container">
<h2>🕌 Minhaji Bayan Admin</h2>

<label>பயான் பெயர்</label>
<input id="name" placeholder="மௌலானா பெயர்">

<label>தேதி</label>
<input id="date" type="date">

<label>பயான் தலைப்பு</label>
<input id="title" placeholder="பயான் தலைப்பு">

<label>விளக்கம் / Content</label>
<textarea id="content" rows="5"
placeholder="பயான் விளக்கம் எழுதவும்"></textarea>

<label>Audio File பெயர்</label>
<input id="audio" placeholder="bayan 31.mp3">

<button onclick="addBayan()">+ பயான் சேர்க்க</button>

<hr>

<button class="secondary" onclick="downloadData()">
JSON Download செய்ய
</button>

<p id="msg"></p>
</div>

<script>
let data = {bayans:[]};

async function loadData(){
  try{
    const response = await fetch("bayan-data.json");
    if(response.ok){
      data = await response.json();
    }
  }catch(e){
    data = {bayans:[]};
  }
}

async function addBayan(){
  const name = document.getElementById("name").value.trim();
  const date = document.getElementById("date").value;
  const title = document.getElementById("title").value.trim();
  const content = document.getElementById("content").value.trim();
  const audio = document.getElementById("audio").value.trim();

  if(!name || !date || !title || !audio){
    alert("பெயர், தேதி, தலைப்பு, Audio பெயர் நிரப்பவும்");
    return;
  }

  data.bayans.unshift({
    id:Date.now(),
    name,date,title,content,audio
  });

  document.getElementById("msg").innerText =
    "பயான் சேர்க்கப்பட்டது! JSON Download செய்யுங்கள்.";

  document.getElementById("name").value="";
  document.getElementById("date").value="";
  document.getElementById("title").value="";
  document.getElementById("content").value="";
  document.getElementById("audio").value="";
}

function downloadData(){
  const blob = new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url;
  a.download="bayan-data.json";
  a.click();
  URL.revokeObjectURL(url);
}

loadData();
</script>

</body>
  </html>
